<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <!-- Eye outer curves -->
  <path d="M20 40 Q110 -8 200 40 Q110 88 20 40 Z" fill="none" stroke="#c9923a" stroke-width="2.2"/>
  <!-- Iris circle -->
  <circle cx="110" cy="40" r="16" fill="none" stroke="#c9923a" stroke-width="2"/>
  <!-- Pupil / nib shaft drop -->
  <circle cx="110" cy="40" r="5" fill="#c9923a"/>
  <!-- Nib shaft descending from iris bottom to point -->
  <line x1="110" y1="45" x2="110" y2="65" stroke="#c9923a" stroke-width="2"/>
  <!-- Nib wings -->
  <path d="M110 65 L100 56 M110 65 L120 56" fill="none" stroke="#c9923a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="110" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c9923a" text-anchor="middle" letter-spacing="3" font-weight="700">VIEWS &amp; REVIEWS</text>
  <!-- Tagline -->
  <text x="110" y="76" font-family="Georgia, serif" font-size="7" fill="#7a7269" text-anchor="middle" letter-spacing="2.5">FILM · TV · CULTURE</text>
</svg>
